name: Test django-altcha-middleware

on: [push, pull_request, workflow_dispatch]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
        django: ['5.2', '6.0', '6.1']
        include:
          - python: '3.9'
            django: '4.2'
          - python: '3.10'
            django: '4.2'
          - python: '3.11'
            django: '4.2'
          - python: '3.12'
            django: '4.2'
          - python: '3.10'
            django: '5.0'
          - python: '3.11'
            django: '5.0'
          - python: '3.12'
            django: '5.0'
          - python: '3.10'
            django: '5.1'
          - python: '3.11'
            django: '5.1'
          - python: '3.12'
            django: '5.1'
          - python: '3.13'
            django: '5.1'

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install django~=${{ matrix.django }}.0
          pip install -e .
          pip install -e .[test]
      - name: Run the tests (and collect coverage data)
        run: coverage run -m pytest
      - name: Lint with ruff
        if: matrix.python == '3.14' && matrix.django == '6.1'
        run: ruff check
      - name: Show the test coverage report
        if: matrix.python == '3.14' && matrix.django == '6.1'
        run: coverage report
